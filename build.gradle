plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.10.0'
    id 'maven-publish'
    id 'signing'
}

group = 'com.tupago'
version = '0.1.0'
description = 'TUPAGO3 gRPC Java SDK client (PaymentService) — frozen contract @ backend3 22ad947'

// Runtime/test JVM is selectable (default 21; certify also on 25 via -PjavaVersion=25).
// Bytecode is ALWAYS pinned to Java 21 (release 21) so the artifact's minimum supported
// bytecode level is preserved regardless of the runtime JVM (correction #2).
def javaVersion = project.findProperty('javaVersion') ?: '21'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion as int)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

ext {
    grpcVersion = '1.84.1'
    protobufVersion = '4.36.2'
    jacksonVersion = '2.18.2'
}

dependencies {
    // gRPC (unshaded netty, aligned to backend's 1.84.1 line)
    api "io.grpc:grpc-api:${grpcVersion}"
    api "io.grpc:grpc-stub:${grpcVersion}"
    api "io.grpc:grpc-protobuf:${grpcVersion}"
    runtimeOnly "io.grpc:grpc-netty:${grpcVersion}"
    // Protobuf runtime
    api "com.google.protobuf:protobuf-java:${protobufVersion}"
    // JSON handling for JsonResponse payloads
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // Testing
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${protobufVersion}" }
    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" }
    }
    generateProtoTasks {
        all().configureEach {
            it.builtins { java {} }
            it.plugins { grpc {} }
        }
    }
}

test {
    useJUnitPlatform()
    // Forward integration toggles from the CLI (-Dit.*) to the test JVM so the guarded
    // RealBackendIntegrationTest can be activated on demand without affecting normal builds.
    if (System.properties.containsKey('it.enabled')) {
        systemProperty 'it.enabled', System.properties['it.enabled']
        systemProperty 'it.target', System.properties['it.target']
        systemProperty 'it.jwt', System.properties['it.jwt']
    }
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

// Javadoc: avoid doclint failures on generated gRPC/proto sources (Gradle 9 / JDK 21+).
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

// Reproducible archives: deterministic JAR ordering/timestamps so artifacts are byte-stable
// across equivalent builds (release hardening). Gradle 9 removed the `reproducibleArchives`
// shortcut; use the granular flags on AbstractArchiveTask.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// ---- Maven publication (SDK-JAVA-03) ----
publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.tupago'
            artifactId = 'tupago3-sdk-java'
            version = project.version
            from components.java
            pom {
                name = 'TUPAGO3 SDK Java'
                description = project.description
                url = 'https://github.com/omarge/tupago3-sdk-java'
                licenses {
                    license {
                        name = 'Proprietary'
                        url = 'https://github.com/omarge/tupago3-sdk-java/blob/main/LICENSE'
                    }
                }
                developers {
                    developer {
                        id = 'omarge'
                        name = 'Omage TUPAGO'
                        organization = 'TUPAGO'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/omarge/tupago3-sdk-java.git'
                    developerConnection = 'scm:git:https://github.com/omarge/tupago3-sdk-java.git'
                    url = 'https://github.com/omarge/tupago3-sdk-java'
                }
            }
        }
    }
}

// Signing is REQUIRED only for a real Central release (CI-provided PGP secret); locally it is
// opt-in so publishToMavenLocal/verification builds stay GREEN without a key (gate: no embedded
// secrets; controlled publish only with authorized credentials).
signing {
    required = { System.getenv('PGP_SECRET') != null || project.hasProperty('signing.keyId') }
    def pgpSecret = System.getenv('PGP_SECRET')
    def pgpPass = System.getenv('PGP_PASSPHRASE')
    if (pgpSecret != null) {
        useInMemoryPgpKeys(pgpSecret, pgpPass ?: '')
    }
    sign publishing.publications.maven
}

