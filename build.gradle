plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.10.0'
}

group = 'com.tupago'
version = '0.1.0'
description = 'TUPAGO3 gRPC Java SDK client (PaymentService) — frozen contract @ backend3 22ad947'

// Runtime/test JVM is selectable (default 21; certify also on 25 via -PjavaVersion=25).
// Bytecode is ALWAYS pinned to Java 21 (release 21) so the artifact's minimum supported
// bytecode level is preserved regardless of the runtime JVM (correction #2).
def javaVersion = project.findProperty('javaVersion') ?: '21'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

ext {
    grpcVersion = '1.84.1'
    protobufVersion = '4.36.2'
    jacksonVersion = '2.18.2'
}

dependencies {
    // gRPC (unshaded netty, aligned to backend's 1.84.1 line)
    api "io.grpc:grpc-api:${grpcVersion}"
    api "io.grpc:grpc-stub:${grpcVersion}"
    api "io.grpc:grpc-protobuf:${grpcVersion}"
    runtimeOnly "io.grpc:grpc-netty:${grpcVersion}"
    // Protobuf runtime
    api "com.google.protobuf:protobuf-java:${protobufVersion}"
    // JSON handling for JsonResponse payloads
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // Testing
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${protobufVersion}" }
    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" }
    }
    generateProtoTasks {
        all().configureEach {
            it.builtins { java {} }
            it.plugins { grpc {} }
        }
    }
}

test {
    useJUnitPlatform()
    // Forward integration toggles from the CLI (-Dit.*) to the test JVM so the guarded
    // RealBackendIntegrationTest can be activated on demand without affecting normal builds.
    if (System.properties.containsKey('it.enabled')) {
        systemProperty 'it.enabled', System.properties['it.enabled']
        systemProperty 'it.target', System.properties['it.target']
        systemProperty 'it.jwt', System.properties['it.jwt']
    }
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}
