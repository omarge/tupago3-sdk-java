// Transport-neutral core of the TUPAGO3 Java SDK (SDK-01).
// Deliberately free of grpc-java, graphql-java, Spring, Netty and any HTTP framework.
// It only depends on Jackson for the Banxico payload model (typed known fields + raw preservation).
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.tupago'
version = '0.1.0'

def javaVersion = project.findProperty('javaVersion') ?: '21'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion as int)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

ext {
    jacksonVersion = '2.18.2'
}

dependencies {
    // JSON handling for the Banxico payload model (known typed fields + raw JsonNode preservation).
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // Testing (no network required for SDK-01 core).
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// SDK consolidation (final certification): make the module independently
// consumable from a Maven repository (internal / mavenLocal / authorized
// release). No Maven Central deployment is added here.
publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.tupago'
            artifactId = project.name
            version = project.version
            from components.java
            pom {
                name = 'TUPAGO3 SDK Java - ' + project.name
                description = 'TUPAGO3 Java SDK module: ' + project.name
                url = 'https://github.com/omarge/tupago3-sdk-java'
                licenses {
                    license {
                        name = 'Proprietary'
                        url = 'https://github.com/omarge/tupago3-sdk-java/blob/main/LICENSE'
                    }
                }
                developers {
                    developer {
                        id = 'omarge'
                        name = 'Omage TUPAGO'
                        organization = 'TUPAGO'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/omarge/tupago3-sdk-java.git'
                    developerConnection = 'scm:git:https://github.com/omarge/tupago3-sdk-java.git'
                    url = 'https://github.com/omarge/tupago3-sdk-java'
                }
            }
        }
    }
    repositories {
        if (project.hasProperty('m2repo')) {
            maven { url = uri(project.property('m2repo')) }
        }
    }
}
