name: Publish

# CONTROLLED-RELEASE TEMPLATE. Triggered ONLY on version tags. It performs NO publication
# unless a release repository AND credentials are explicitly authorized and wired into the
# Gradle publishing configuration (currently no repository is configured, so `./gradlew publish`
# has no target and will not push anywhere). Maven Central / OSSRH require an authorized
# release: a release repository, Sonatype credentials, and PGP signing. This workflow is NOT
# auto-publishing and must not be mistaken for a live Central deployment (gate: no public
# release without explicit authorization + configuration).
on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Publish to Maven Central
        run: ./gradlew publish -PjavaVersion=21 --no-daemon
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
