# Portable Gradle configuration.
#
# NOTE: No host-specific toolchain paths are pinned here. The build targets Java 21
# bytecode (options.release = 21) and selects the runtime/toolchain via -PjavaVersion
# (21 or 25). CI uses actions/setup-java (Temurin), which provisions the JDKs in
# standard locations Gradle auto-detects. Local developers may point Gradle at their
# installed JDKs without modifying this file, e.g.:
#   ./gradlew clean build -PjavaVersion=21 \
#     -Porg.gradle.java.installations.paths=$HOME/.sdkman/candidates/java/21.0.8-zulu,$HOME/.sdkman/candidates/java/25.0.1-zulu
org.gradle.welcome=never
